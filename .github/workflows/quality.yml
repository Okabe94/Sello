name: Quality

# No path filters: every merge candidate runs the gate, including changes to this file.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pull requests are checked out as the merge commit; BASE is what it merges into.
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify the merge candidate (G2 on API 30)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./scripts/verify-ticket --merge-candidate "$BASE" --gate G2

      - name: Validate completion evidence
        run: python3 docs/planning/mvp/board.py --check --base "$BASE"

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          retention-days: 90
          if-no-files-found: warn
          path: |
            build/reports/quality/
            */build/reports/lint-results-debug.*
            */build/reports/ktlint/
            */build/test-results/
            */build/outputs/androidTest-results/
